plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.0' // 3.0.1 -> 3.2.0 업그레이드
	id 'io.spring.dependency-management' version '1.1.2'
}

group = 'haule'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '18' // 참고: Java 18은 비-LTS 버전입니다. Java 17 또는 21(LTS)로 변경을 권장합니다.

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

ext['tomcat.version'] = '10.0.27'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // 버전은 부모에서 관리
	implementation 'org.springframework.boot:spring-boot-devtools'
	
	implementation 'org.springframework.security:spring-security-web'
	implementation 'org.springframework.security:spring-security-config'
	implementation 'org.springframework.security:spring-security-core'
	implementation 'org.springframework.security:spring-security-taglibs'
	
	
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
	
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'commons-io:commons-io:2.11.0'
	
	implementation 'net.nurigo:sdk:4.2.7'
	
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:10.0.27'
	
	implementation 'org.mybatis:mybatis:3.5.11'
	implementation 'org.mybatis:mybatis-spring:3.0.0'
	// mysql:mysql-connector-java는 더 이상 사용되지 않음. com.mysql:mysql-connector-j 사용
	
	implementation 'com.zaxxer:HikariCP'
	compileOnly 'org.projectlombok:lombok'
	compileOnly 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.1.RELEASE'
	
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// JUnit 5는 spring-boot-starter-test에 포함되어 있으므로 별도 추가 불필요
	// testImplementation 'junit:junit:4.13.2' // JUnit 4는 제거, JUnit 5 사용
	
}

tasks.named('test') {
	useJUnitPlatform()
}
