    <script>
    	$('.category_names')

   				function(){
   					var categorylist = $(this).children('.category_list');
   					
   					if(categorylist.length == 0){
   						$(this).children('.category_name').css('border','1px solid');
   	   					$(this).children('.category_name').css('border-image','linear-gradient(to right, #5858AC -50%, #7DC0CE 100%');

   					}
   					else{
   						categorylist.css('display', 'block');
   						
   						$(this).children('.category_name').css('border','1px solid');
   	   					$(this).children('.category_name').css('border-bottom','0');

   					}
   					
   					
   					
   				})
