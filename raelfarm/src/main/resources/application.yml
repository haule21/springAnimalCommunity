spring:
  profiles:
    active: local # application-local.properties를 활성화
  datasource:
    hikari:
      driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      # 민감 정보는 application-local.properties에서 관리합니다
      # jdbc-url, username, password는 application-local.properties에 정의

  thymeleaf:  
    prefix: classpath:templates/
    suffix: .html
   
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mvc:
    converters:
      preferred-json-mapper: gson

  devtools:
    livereload:
      enabled: true
      
  jpa:
    database: mysql
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
      
server:
  port: 8443
  
  ssl:
    # SSL 설정은 application-local.properties에서 관리합니다
    key-store-type: jks
    # key-store, key-store-password, key-alias는 application-local.properties에 정의
    
mybatis:
  mapper-locations: classpath:mapper/**/*.xml 
  
logging:
  level:
    '[org.springframework.web]': debug
    